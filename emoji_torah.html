<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Content-Security-Policy (defense-in-depth), right after <meta charset> as on every page. This stub loads only
     itself and /js/i18n.js (which fetches /locales/*.json): no gtag, no Google Fonts, no images but the favicon. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The Parsha Emojis page was emoji_torah.html until its launch; it is parsha_emojis.html now. This stub forwards an
     old bookmark or link there, keeping the query and the hash (?lang=, and a sign-in return's ?code= or #ivsignin=,
     which the account module reads on the page it lands on). It carries no gtag (the hop would count as a second page
     view), stays noindex with its canonical on the new page, and is neither precached nor in the sitemap.
     The meta refresh is only for a browser without JavaScript: outside <noscript> it could fire after the
     location.replace and drop the query. -->
<script>try { location.replace('parsha_emojis.html' + location.search + location.hash); } catch (e) {}</script>
<noscript><meta http-equiv="refresh" content="0; url=parsha_emojis.html"></noscript>
<title>Parsha Emojis | IvritSuite</title>
<link rel="canonical" href="https://ivritsuite.com/parsha_emojis.html">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<script src="/js/i18n.js" defer></script>
<style>
body{margin:0;padding:40px 16px;font-family:'Source Sans 3',system-ui,sans-serif;background:#fdf8ef;color:#1a2744;text-align:center;}
a{color:#7f5a13;font-weight:600;}
@media (prefers-color-scheme: dark){body{background:#161c2a;color:#dde4f0;}a{color:#e0a832;}}
</style>
</head>
<body>
<p><a href="parsha_emojis.html" data-i18n="emojitorah.moved.link">The Parsha Emojis have moved — open them here</a></p>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    function applyI18n() { I18n.applyStaticI18n(); }
    if (window.I18n) { I18n.ready.then(applyI18n); I18n.onChange(applyI18n); }
  });
</script>
</body>
</html>
