<title>A Moveable Feast of Learning</title>
<!-- The maintainer's own presentation, hosted here by its address only: a 3D walk-through locked with a password.

<style>
:root{
  --enamel:#17357f; --enamel-hi:#2148a6; --enamel-deep:#0d2152;
  --frame:#1e6a45; --frame-hi:#2d8a5c; --frame-lo:#123f2a;
  --light:#4be3a0; --ink:#f8f5eb; --ink-soft:#c3cfee;
  --line:#5b78bd; 
  --serif:"Newsreader","Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --label:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --he:"Frank Ruhl Libre","Times New Roman",serif;
  --pad:clamp(10px,2.1vw,34px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:linear-gradient(#8fbbe8 0%,#f6e6d0 72%,#b9c9a0 72%);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene.grabbing{cursor:grabbing}
body.no3d #scene{display:none}
#veil{position:fixed;inset:0;background:var(--enamel-deep);opacity:0;pointer-events:none;transition:opacity .22s ease}
#veil.on{opacity:1}
.plaque{position:fixed;left:var(--pad);bottom:var(--pad);width:min(41vw,610px);
  background:linear-gradient(180deg,var(--enamel-hi) 0%,var(--enamel) 46%,#142e70 100%);
  border:5px solid var(--frame);border-color:var(--frame-hi) var(--frame-lo) var(--frame-lo) var(--frame-hi);border-radius:5px;
  box-shadow:inset 0 0 0 1.5px rgba(8,18,50,.9),inset 0 0 0 3px rgba(255,255,255,.26),0 14px 34px rgba(8,16,44,.42);
  transition:opacity .26s ease,transform .26s ease}
.plaque.out{opacity:0;transform:translateY(8px);pointer-events:none}
.plaque .scroll{max-height:calc(100vh - 2*var(--pad) - 60px);max-height:calc(100dvh - 2*var(--pad) - 60px);overflow:auto;
  padding:clamp(22px,2.2vw,36px) clamp(18px,2vw,32px) clamp(16px,1.7vw,26px)}
.cap{position:absolute;left:50%;bottom:100%;width:78px;height:44px;margin-left:-39px}
.cap .arch{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.cap .arch::before{content:"";box-sizing:border-box;position:absolute;left:0;top:0;width:100%;height:60px;
  border:5px solid var(--frame-hi);border-radius:39px 39px 0 0;background:var(--enamel-hi);
  box-shadow:inset 0 0 0 1.5px rgba(8,18,50,.9),inset 0 0 0 3px rgba(255,255,255,.26)}
.cap::before{content:"";position:absolute;left:8px;top:calc(100% - 2px);width:2px;height:5px;box-shadow:-1.5px 0 0 var(--line),61.5px 0 0 var(--line)}
.cap::after{content:"";position:absolute;left:8px;right:8px;top:calc(100% - 3px);height:9px;background:var(--enamel-hi)}
.cap .num{position:absolute;left:0;right:0;top:15px;font:600 22px/1 var(--label);letter-spacing:.06em;text-indent:.06em;text-align:center;font-variant-numeric:tabular-nums}
.place{margin:0 0 .5em;font:600 clamp(13px,1.06vw,17px)/1.2 var(--label);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft)}
#title{margin:0 0 .42em;font:500 clamp(27px,2.55vw,44px)/1.06 var(--serif);letter-spacing:-.012em;text-wrap:balance}
#body{font:400 clamp(16px,1.3vw,22px)/1.45 var(--serif)}
#body p{margin:0 0 .62em}
#body > :last-child{margin-bottom:0}
.he{font-family:var(--he);font-size:1.12em;line-height:1}
.pairs{list-style:none;margin:.1em 0 .6em;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}
.pairs li{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:8px;padding:3px 10px 4px;border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(8,20,60,.3)}
.pairs b{font:600 .84em/1.15 var(--label);letter-spacing:.11em;text-transform:uppercase}
.pairs .he{justify-self:end;font-size:1.02em}
.pairs .tr{grid-column:1/-1;font-size:.72em;line-height:1.1;font-style:italic;color:var(--ink-soft)}
.five{margin:.1em 0 0;padding:0;list-style:none;counter-reset:q;display:flex;flex-wrap:wrap;gap:6px 8px}
.five li{counter-increment:q;padding:4px 11px 5px 9px;border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(8,20,60,.3);font-size:.92em}
.five li::before{content:counter(q);font:600 .92em var(--label);color:var(--light);margin-right:8px}
.plaque[data-kind="title"]{width:min(47vw,720px)}
.plaque[data-kind="title"] #title{font-size:clamp(34px,3.75vw,68px);margin-bottom:.2em}
#body .sub{font-style:italic;font-size:1.24em;line-height:1.25;margin-bottom:.95em}
#body .by{font:600 clamp(13px,1.06vw,17px)/1.3 var(--label);letter-spacing:.13em;text-transform:uppercase}
.starts{display:flex;flex-wrap:wrap;gap:10px;margin:1.15em 0 0}
.btn.start{display:grid;grid-template-columns:auto 1fr;align-items:center;row-gap:6px;text-align:left;padding:11px 18px 10px 14px;font-size:clamp(14px,1.12vw,18px);background:var(--enamel-deep)}
.btn.start:hover{background:var(--enamel)}
.start .lbl{grid-column:2}
.start small{grid-column:1/-1;font:500 .72em/1.1 var(--label);letter-spacing:.1em;color:var(--ink-soft)}
.start .lamp{display:none}
.btn.start[aria-current="true"]{background:#1b7a50;border-color:#3aa878 #0d4a30 #0d4a30 #3aa878}
.btn.start[aria-current="true"]:hover{background:#218f5e}
.start[aria-current="true"] .lamp{display:inline-block}
.start[aria-current="true"] small{color:var(--ink)}
#body .walk{display:flex;width:fit-content;align-items:center;gap:10px;margin-top:1em;font:600 clamp(13px,1.02vw,16px)/1.2 var(--label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
#body .walk input{width:19px;height:19px;margin:0;flex:none;accent-color:var(--light);cursor:pointer}
#body .hint{margin-top:1.1em;font:500 clamp(12px,.96vw,15px)/1.3 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
body.locked #scene,body.locked #veil,body.locked #map,body.locked #card,body.locked #nav,body.locked #list,body.locked #no3d-note{display:none}
.plaque.lock{left:50%;right:auto;bottom:auto;top:clamp(8px,calc((100vh - 340px)*.22),150px);transform:translateX(-50%);width:min(calc(100vw - 16px),480px);max-width:none}
.lock .scroll{max-height:none;overflow:visible}
.lock h1{margin:0 0 .7em;font:500 clamp(27px,6.4vw,38px)/1.06 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.lock label{display:block;margin:0 0 7px;font:600 14px/1.2 var(--label);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft)}
.pwrow{display:flex;gap:8px}
#pw{flex:1;min-width:0;margin:0;padding:10px 12px;font:400 18px/1.25 var(--serif);color:var(--ink);background:var(--enamel-deep);border:2px solid rgba(255,255,255,.55);border-radius:4px;-webkit-appearance:none;appearance:none}
#pw:focus{outline:3px solid var(--light);outline-offset:1px}
#pw-msg{min-height:1.45em;margin:.45em 0 .65em;font:400 17px/1.45 var(--serif);color:#ffdcae}
#pw-go{font-size:clamp(14px,1.12vw,17px);padding:12px 22px 12px 16px}
@media (max-height:430px){.lock .scroll{padding-top:14px;padding-bottom:12px}.lock h1{font-size:26px;margin-bottom:.45em}#pw-msg{margin:.25em 0 .4em}}
@media (max-width:600px){.plaque.lock{top:16px}}
#nav{position:fixed;right:var(--pad);bottom:var(--pad);display:flex;gap:8px;align-items:stretch}
.btn{appearance:none;-webkit-appearance:none;font:600 clamp(13px,1vw,16px)/1 var(--label);letter-spacing:.13em;text-transform:uppercase;color:var(--ink);background:var(--enamel);
  border:3px solid var(--frame);border-color:var(--frame-hi) var(--frame-lo) var(--frame-lo) var(--frame-hi);border-radius:4px;padding:11px 14px;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(8,18,50,.85),0 6px 16px rgba(8,16,44,.35)}
.btn:hover{background:var(--enamel-hi)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.stop:focus-visible,#list li button:focus-visible{outline:3px solid var(--light);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.btn[disabled]:hover{background:var(--enamel)}
.btn[aria-pressed="true"]{background:var(--enamel-hi)}
.btn.go{background:#1b7a50;border-color:#3aa878 #0d4a30 #0d4a30 #3aa878;padding-right:18px}
.btn.go:hover{background:#218f5e}
.btn.go[disabled]:hover{background:#1b7a50}
.btn .short{display:none}
.lamp{display:inline-block;width:.62em;height:.62em;margin-right:.62em;border-radius:50%;background:var(--light);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 12px 3px rgba(75,227,160,.85);vertical-align:.03em}
#count{display:grid;place-items:center;min-width:5.2em;padding:0 10px;text-transform:uppercase;white-space:nowrap;border-radius:4px;background:rgba(13,33,82,.84);font:600 clamp(13px,1vw,16px)/1 var(--label);letter-spacing:.1em;font-variant-numeric:tabular-nums}
#map{position:fixed;left:var(--pad);top:var(--pad);width:min(23vw,340px);margin:0;padding:7px 9px 8px;background:rgba(15,38,96,.88);
  border:3px solid var(--frame);border-color:var(--frame-hi) var(--frame-lo) var(--frame-lo) var(--frame-hi);border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(8,18,50,.85),0 10px 26px rgba(8,16,44,.35)}
#map.hidden{display:none}
#plan{display:block;width:100%;height:auto;overflow:visible}
.slab{fill:rgba(255,255,255,.07)}
.wing{fill:url(#hatch)}
.water{fill:#63b4ea;opacity:.6}
.wall{stroke:#f8f5eb;stroke-width:5;stroke-linecap:square}
.col{fill:#f8f5eb}
.room{font:600 21px var(--label);letter-spacing:2px;fill:rgba(248,245,235,.74);text-anchor:middle}
.route{fill:none;stroke:rgba(248,245,235,.6);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;stroke-linejoin:round}
.stop{fill:var(--enamel-deep);stroke:#f8f5eb;stroke-width:3;cursor:pointer}
.stop.seen{fill:#f8f5eb}
.stop.on{fill:var(--light);stroke:#fff}
.tour{display:none}
body[data-mode="full"] .tour[data-mode="full"],body[data-mode="quick"] .tour[data-mode="quick"]{display:inline}
#me{transition:opacity .4s}
#me .dot{fill:var(--light);stroke:#fff;stroke-width:3.5}
#me .cone{fill:rgba(75,227,160,.6)}
#list{position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);display:flex;flex-direction:column;background:var(--enamel-deep);border-left:5px solid var(--frame);
  transform:translateX(105%);visibility:hidden;transition:transform .26s ease,visibility 0s .26s;box-shadow:-18px 0 40px rgba(8,16,44,.45)}
#list.open{transform:none;visibility:visible;transition:transform .26s ease,visibility 0s}
#list header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 16px 10px 22px}
#list h2{margin:0;font:500 26px/1.1 var(--serif)}
.tabs{display:flex;gap:8px;padding:2px 16px 8px 22px}
.tabs .btn{flex:1;padding:9px 10px;text-align:center}
.tabs .btn[aria-pressed="true"]{background:#1b7a50;border-color:#3aa878 #0d4a30 #0d4a30 #3aa878}
#list-body{overflow:auto;padding:0 12px 24px 22px}
#list h3{margin:18px 0 6px;font:600 13px/1.2 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
#list ol{list-style:none;margin:0;padding:0}
#list li button{display:grid;grid-template-columns:2.1em 1fr;column-gap:4px;width:100%;text-align:left;background:none;border:0;border-radius:4px;color:var(--ink);padding:7px 8px;cursor:pointer;font:400 17px/1.25 var(--serif)}
#list li button:hover{background:rgba(255,255,255,.08)}
#list li button[aria-current]{background:var(--enamel);box-shadow:inset 3px 0 0 var(--light)}
#list .n{font:600 15px/1.45 var(--label);color:var(--light);font-variant-numeric:tabular-nums}
#list .p{grid-column:2;font:500 12px/1.3 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
#no3d-note{display:none;position:fixed;right:var(--pad);top:var(--pad);max-width:30em;margin:0;padding:10px 14px;border-radius:4px;background:rgba(13,33,82,.88);font:400 16px/1.4 var(--serif)}
body.no3d #no3d-note{display:block}
body.no3d #map{width:min(92vw,780px)}
body.narrow .plaque,body.narrow .plaque[data-kind="title"]{left:8px;right:8px;width:auto;max-width:720px;bottom:66px}
body.narrow #body{font-size:clamp(16px,2.3vw,19px)}
body.narrow .plaque .scroll{max-height:46vh;padding:20px 16px 14px}
body.narrow .plaque[data-kind="title"] .scroll{max-height:66vh}
body.narrow #nav{left:8px;right:8px;bottom:8px;justify-content:space-between;gap:6px}
body.narrow .btn{padding:11px 10px;letter-spacing:.09em}
body.narrow .btn .long{display:none}
body.narrow .btn .short{display:inline}
body.narrow #map{top:8px;left:auto;right:8px;width:min(64vw,340px)}
body.narrow #count{min-width:0;padding:0 6px}
@media (max-width:430px){#count{display:none}}
@media (max-width:859px),(max-aspect-ratio:21/20){
  .plaque,.plaque[data-kind="title"]{left:8px;right:8px;width:auto;max-width:720px;bottom:66px}
  #nav{left:8px;right:8px;bottom:8px;justify-content:space-between;gap:6px}
}
@media (prefers-reduced-motion:reduce){.plaque,#list,#veil{transition:none}}
</style>
</head>
<body class="locked" data-mode="full">
<form class="plaque lock" id="lock" novalidate>
  <div class="scroll">
    <p class="place">Password required</p>
    <h1>A Moveable Feast of Learning</h1>
    <label for="pw">Password</label>
    <div class="pwrow">
      <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="btn" id="pw-show" type="button" aria-pressed="false">Show</button>
    </div>
    <p id="pw-msg" role="alert"></p>
    <button class="btn go" id="pw-go" type="submit"><span class="lamp" aria-hidden="true"></span><span id="pw-label">Unlock</span></button>
  </div>
</form>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>

<aside id="map" aria-label="Plan">
  <svg id="plan" viewBox="-262 -240 868 480" role="img" aria-label="Floor plan with the route and your position">
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="7" height="7" fill="rgba(255,255,255,.05)"></rect>
        <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(255,255,255,.34)" stroke-width="1.8"></line>
      </pattern>
    </defs>
  </svg>
</aside>

<main class="plaque" id="card" data-kind="title" aria-live="polite">
  <div class="cap" id="cap" aria-hidden="true" hidden><span class="arch"></span><span class="num" id="cap-n"></span></div>
  <div class="scroll">
    <p class="place" id="place"></p>
    <h1 id="title"></h1>
    <div id="body"></div>
  </div>
</main>

<nav id="nav" aria-label="Tour controls">
  <button class="btn" id="btn-list" type="button" aria-expanded="false" aria-controls="list">Stops</button>
  <button class="btn" id="btn-map" type="button" aria-pressed="true">Map</button>
  <button class="btn" id="btn-full" type="button" aria-pressed="false"><span class="long">Full screen</span><span class="short">Full</span></button>
  <span id="count" aria-hidden="true"></span>
  <button class="btn" id="btn-back" type="button" disabled>Back</button>
  <button class="btn go" id="btn-next" type="button"><span class="lamp" aria-hidden="true"></span>Next</button>
</nav>

<section id="list" aria-label="All stops" aria-hidden="true">
  <header><h2>Stops</h2><button class="btn" id="list-close" type="button">Close</button></header>
  <div class="tabs" role="group" aria-label="Version">
    <button class="btn" id="tab-full" type="button" data-tab="full" aria-pressed="true">Full</button>
    <button class="btn" id="tab-quick" type="button" data-tab="quick" aria-pressed="false">Quick</button>
  </div>
  <div id="list-body"></div>
</section>

<p id="no3d-note">The 3D view could not start in this browser. The stops, the text and the plan still work.</p>
