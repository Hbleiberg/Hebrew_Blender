<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2744"/>

  <!-- Subtle radial highlight -->
  <defs>
    <radialGradient id="glow" cx="22%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#243b6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2744" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold accent bars -->
  <rect x="0" y="0" width="1200" height="8" fill="#c9922a"/>
  <rect x="0" y="622" width="1200" height="8" fill="#c9922a"/>

  <!-- Decorative Hebrew watermark on the right.
       Pre-reversed from "אֶרֶץ" (eretz) because cairosvg does not apply
       Unicode bidi to <text>; bytes are in visual LTR order. -->
  <text x="1140" y="430" text-anchor="end"
        font-family="FreeSerif, Liberation Serif, serif"
        font-size="320" font-weight="700"
        fill="#c9922a" fill-opacity="0.14">ץרֶאֶ</text>

  <!-- Star of David: two equilateral triangles inscribed in a r=40 circle
       centered at (40,40), forming a proper hexagram. -->
  <g transform="translate(80, 70)" stroke="#c9922a" stroke-width="6" fill="none" stroke-linejoin="round">
    <polygon points="40,0 74.64,60 5.36,60"/>
    <polygon points="40,80 5.36,20 74.64,20"/>
  </g>

  <!-- Brand mark label next to star -->
  <text x="180" y="120"
        font-family="Liberation Sans, DejaVu Sans, sans-serif"
        font-size="22" font-weight="700"
        letter-spacing="6"
        fill="#f0d080">IVRITSUITE</text>

  <!-- Headline -->
  <text x="80" y="290"
        font-family="Liberation Serif, FreeSerif, serif"
        font-size="120" font-weight="700"
        fill="#ffffff">Free Hebrew</text>
  <text x="80" y="400"
        font-family="Liberation Serif, FreeSerif, serif"
        font-size="120" font-weight="700"
        fill="#ffffff">Literacy Tools</text>

  <!-- Subhead -->
  <text x="80" y="470"
        font-family="Liberation Sans, DejaVu Sans, sans-serif"
        font-size="32" font-weight="400"
        fill="#f0d080">Worksheets · Dictionary · Flash Cards · Classroom Dashboard</text>

  <!-- CTA -->
  <rect x="80" y="520" width="360" height="64" rx="8" fill="#c9922a"/>
  <text x="260" y="563" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, sans-serif"
        font-size="28" font-weight="700"
        fill="#1a2744">ivritsuite.com  →</text>

  <!-- Author credit -->
  <text x="1120" y="568" text-anchor="end"
        font-family="Liberation Sans, DejaVu Sans, sans-serif"
        font-size="18" font-weight="400"
        fill="#8a94a8">For teachers &amp; students of Hebrew</text>
</svg>
